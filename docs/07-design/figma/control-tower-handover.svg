<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000"><rect width="1200" height="1000" fill="#F2F5F7"/><g font-family="Inter,Arial,sans-serif"><text x="40" y="46" font-size="25" font-weight="700" fill="#192D3C">Control Tower · planner and customer handover</text><text x="40" y="76" font-size="14" fill="#526273">Fictional portfolio · 2026-10-17 · editable vector handover</text><g id="screen-1" transform="translate(40,110)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#24508F"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">1 / Exception workbench</text><text x="22" y="86" font-size="14" fill="#526273">US-03 · planner Europe/Brussels</text><text x="22" y="120" font-size="13" fill="#526273">Ordering</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">Critical → major → minor</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Priority within severity</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">Earliest response deadline</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Detail</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">Window → ETA · same zone</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Missing status</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">HELD · customer not told</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#24508F"/><text x="38" y="330" font-size="14" fill="white">Select exception → acknowledge</text><text x="22" y="371" font-size="12" fill="#526273">WCAG: status words + colour; keyboard focus; responsive list/detail.</text></g><g id="screen-2" transform="translate(620,110)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#24508F"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">2 / Response and replan</text><text x="22" y="86" font-size="14" fill="#526273">US-04 / US-08 / US-11 · authorised owner</text><text x="22" y="120" font-size="13" fill="#526273">Role check</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">Road planning / shift lead</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">New window input</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">Europe/Brussels → UTC</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Clocks change</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">Reject missing/ambiguous time</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Resolve</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">Reason required; Other needs note</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#24508F"/><text x="38" y="330" font-size="14" fill="white">Record new window → resolve</text><text x="22" y="371" font-size="12" fill="#526273">Messages render in UK time. No UTC suffix guessing from inputs.</text></g><g id="screen-3" transform="translate(40,540)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#24508F"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">3 / Customer tracking</text><text x="22" y="86" font-size="14" fill="#526273">US-05 / US-10 · Europe/London</text><text x="22" y="120" font-size="13" fill="#526273">Public details</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">Window · ETA · reason</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Source</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">Sent messages only</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Internal severity / IDs</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">Never exposed</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Held status</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">No unconfirmed delay notice</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#24508F"/><text x="38" y="330" font-size="14" fill="white">Read update → contact planner</text><text x="22" y="371" font-size="12" fill="#526273">Same instant: Thu 13:40 Brussels = Thu 12:40 London (winter).</text></g><g id="screen-4" transform="translate(620,540)"><rect width="540" height="390" rx="12" fill="white" stroke="#CBD5DD"/><path d="M12 0 H528 Q540 0 540 12 V56 H0 V12 Q0 0 12 0" fill="#24508F"/><text x="22" y="35" font-size="19" font-weight="600" fill="white">4 / Validation and audit</text><text x="22" y="86" font-size="14" fill="#526273">US-12 / US-13 · delivery and evidence</text><text x="22" y="120" font-size="13" fill="#526273">Actual checks</text><text x="225" y="120" font-size="14" font-weight="600" fill="#192D3C">Unit / browser test results</text><path d="M22 133 H518" stroke="#E7ECEF"/><text x="22" y="162" font-size="13" fill="#526273">Human usability test</text><text x="225" y="162" font-size="14" font-weight="600" fill="#192D3C">P1 / P2 · NOT EXECUTED</text><path d="M22 175 H518" stroke="#E7ECEF"/><text x="22" y="204" font-size="13" fill="#526273">Ownership</text><text x="225" y="204" font-size="14" font-weight="600" fill="#192D3C">Owner must supply own evidence</text><path d="M22 217 H518" stroke="#E7ECEF"/><text x="22" y="246" font-size="13" fill="#526273">Feedback loop</text><text x="225" y="246" font-size="14" font-weight="600" fill="#192D3C">Observation → change → retest</text><path d="M22 259 H518" stroke="#E7ECEF"/><rect x="22" y="305" width="496" height="38" rx="6" fill="#24508F"/><text x="38" y="330" font-size="14" fill="white">Run three tasks with each participant</text><text x="22" y="371" font-size="12" fill="#526273">Screenshots from the current app accompany this editable specification.</text></g><text x="40" y="988" font-size="13" fill="#526273">Read order: 1 → 2 → 3 → 4. Alternate states and traceability are specified in the accompanying handover.</text></g></svg>