name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  acceptance-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run acceptance examples against the business rules
        run: node --test tests/*.test.mjs
      - name: Check links
        run: python3 scripts/check-links.py
